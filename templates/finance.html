<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<style>
body { margin:0; font-family:'Segoe UI', sans-serif; background:#0a0a0a; color:#FFD700; }
.finance-page { width:95%; max-width:1000px; margin:2rem auto; background:#111; border-radius:15px; padding:2rem; box-shadow:0 8px 25px rgba(0,0,0,0.4);}
.finance-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
.finance-header h1 { font-size:2rem; color:#FFD700; }
.finance-cards { display:flex; gap:1rem; flex-wrap:wrap; }
.finance-card { flex:1 1 200px; background:linear-gradient(145deg, #111, #1a1a1a); border-radius:15px; padding:1.2rem; box-shadow:0 6px 20px rgba(0,0,0,0.5); transition: transform 0.3s, box-shadow 0.3s; }
.finance-card:hover { transform:translateY(-5px); box-shadow:0 10px 30px rgba(255,215,0,0.6);}
.finance-card h2 { font-size:1.2rem; margin-bottom:0.5rem; color:#FFD700; }
.finance-card input { width:100%; padding:0.5rem; font-size:1rem; border-radius:8px; border:none; background:#222; color:#FFD700; margin-bottom:0.5rem; }
.finance-card button { width:100%; padding:0.5rem; background:#FFD700; color:#0a0a0a; border:none; border-radius:8px; cursor:pointer; font-weight:700; transition: all 0.2s ease; }
.finance-card button:hover { background:#FFC700; transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,215,0,0.4);}
.finance-transactions { margin-top:2rem; background:#111; border-radius:12px; padding:1rem; overflow-x:auto; }
.finance-transactions table { width:100%; border-collapse:collapse; color:#FFD700; }
.finance-transactions th, .finance-transactions td { padding:0.8rem; text-align:left; border-bottom:1px solid #333; }
.finance-transactions th { font-weight:700; color:#FFC700; }
</style>
</head>
<body>
<div class="finance-page">
    <div class="finance-header">
        <h1>Finance Overview</h1>
        <span>{{ username }}</span>
    </div>
    <div class="finance-cards">
        {% for b in budgets %}
        <div class="finance-card">
            <h2>{{ b.name }}</h2>
            <input type="number" id="budget-{{ b.name }}" value="{{ b.balance }}" step="0.01">
            <button onclick="updateBudget('{{ b.name }}')">Save</button>
        </div>
        {% endfor %}
    </div>
    <div class="finance-transactions">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Budget</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody>
                {% for t in transactions %}
                <tr>
                    <td>{{ t.date }}</td>
                    <td>{{ t.budget }}</td>
                    <td>{{ t.description }}</td>
                    <td>{{ t.category }}</td>
                    <td>{{ t.amount }}</td>
                    <td>{{ t.type }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script>
function updateBudget(name){
    const val = parseFloat(document.getElementById('budget-' + name).value);
    fetch('/finance/update_budget', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({budget:name, balance:val})
    }).then(res=>res.json()).then(data=>{
        if(data.status==='ok') alert('Budget updated!');
    });
}
</script>


<nav class="bottom-menu">
    <ul>
        <li><a href="{{ url_for('chat') }}"><img src="{{ url_for('static', filename='images/Message_Icon.png') }}" width="100" height="100" alt="Chat"></a></li>
        <li><a href="{{ url_for('todo') }}"><img src="{{ url_for('static', filename='images/to_do_list_icon.png') }}" alt="Tasks"></a></li>
        <li><a href="{{ url_for('chatbot') }}"><img src="{{ url_for('static', filename='images/Bolt_AI_Icon.png') }}" alt="Chatbot"></a></li>
        <li><a href="{{ url_for('sim') }}"><img src="{{ url_for('static', filename='images/Sim_icon.png') }}" alt="Sim"></a></li>
        <li><a href="{{ url_for('react') }}"><img src="{{ url_for('static', filename='images/Reaction_Time_Icon.png') }}" alt="VR City"></a></li>
        <li><a href="{{ url_for('AR_sim') }}"><img src="{{ url_for('static', filename='images/AR_icon.png') }}" alt="AR Sim"></a></li>
        <li><a href="{{ url_for('finance') }}"><img src="{{ url_for('static', filename='images/finance_icon.png') }}" alt="Finance"></a></li>
    </ul>
</nav>


</body>
</html>
