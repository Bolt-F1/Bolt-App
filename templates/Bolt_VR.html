<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bolt City VR — Fast Camera + Collidable City</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
    <style>body{margin:0;font-family:Arial,Helvetica,sans-serif}</style>
  </head>
  <body>
    <a-scene physics="gravity: -9.8" vr-mode-ui="enabled: true">

      <!-- Assets -->
      <a-assets>
        <a-asset-item id="cityObj" src="{{ url_for('static', filename='models/Bolt_City_Proto_2.obj') }}"></a-asset-item>
        <a-asset-item id="cityMtl" src="{{ url_for('static', filename='models/Bolt_City_Proto_2.mtl') }}"></a-asset-item>
      </a-assets>

      <!-- City with automatic collision and matte material -->
      <a-entity id="city"
                obj-model="obj: #cityObj; mtl: #cityMtl"
                static-body
                shape="auto"
                position="0 0 0"
                scale="1 1 1"
                material="color: gray; flatShading: true; metalness: 0; roughness: 1">
      </a-entity>

      <!-- Player -->
      <a-entity id="player"
                position="0 100 5" 
                geometry="primitive: box; width: 1; height: 2; depth: 1"
                material="color: red; opacity:1"
                dynamic-body="mass: 80; linearDamping: 0.02; angularDamping: 0.9"
                player-controls="maxForce:20000; maxSpeed:500; steerSpeed:150">
        <a-camera>
          <a-text id="speedText" value="Speed: 0" position="0 -0.4 -1.5" width="4" color="#FFF"></a-text>
        </a-camera>
      </a-entity>

      <!-- Lighting -->
      <a-entity light="type: ambient; intensity: 3; color: #ffffff"></a-entity>
      <a-entity light="type: directional; intensity: 2" position="10 20 10" rotation="-45 0 0"></a-entity>
      <a-entity light="type: directional; intensity: 1.5" position="-10 20 -10" rotation="-45 180 0"></a-entity>

    </a-scene>

    <script>
      // Player controls
      AFRAME.registerComponent('player-controls', {
        schema: {
          maxForce: {type: 'number', default: 20000},
          steerSpeed: {type: 'number', default: 150},
          maxSpeed: {type: 'number', default: 500}
        },
        init: function () {
          this.forward = 0;
          this.steer = 0;
          this.el.addEventListener('body-loaded', () => { this.body = this.el.body; });
          window.addEventListener('keydown', e => this.handleKey(e, true));
          window.addEventListener('keyup', e => this.handleKey(e, false));
        },
        handleKey: function (e, down) {
          const k = e.key.toLowerCase();
          if (k === 'w' || k === 'arrowup') this.forward = down ? 1 : 0;
          if (k === 's' || k === 'arrowdown') this.forward = down ? -1 : 0;
          if (k === 'a' || k === 'arrowleft') this.steer = down ? -1 : 0;
          if (k === 'd' || k === 'arrowright') this.steer = down ? 1 : 0;
        },
        tick: function (time, delta) {
          if (!this.body) return;
          const dt = delta / 1000;
          const vel = this.body.velocity;

          // Forward vector
          const forward = new THREE.Vector3(0, 0, -1);
          this.el.object3D.getWorldDirection(forward);
          const fVec = new CANNON.Vec3(forward.x, forward.y, forward.z);

          const currentSpeed = vel.x * fVec.x + vel.y * fVec.y + vel.z * fVec.z;

          if (this.forward !== 0) {
            const forceMag = this.data.maxForce;
            const speedCap = this.data.maxSpeed;
            let factor = Math.max(0, 1 - Math.abs(currentSpeed) / speedCap);
            const applied = fVec.scale(forceMag * this.forward * factor * dt);
            this.body.applyForce(applied, this.body.position);
          }

          // Steering
          if (this.steer !== 0 && Math.abs(currentSpeed) > 0.5) {
            const steerAmount = THREE.MathUtils.degToRad(this.data.steerSpeed) * this.steer * dt;
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), steerAmount);
            this.body.quaternion = this.body.quaternion.mult(q);
            this.el.object3D.quaternion.copy(new THREE.Quaternion(this.body.quaternion.x, this.body.quaternion.y, this.body.quaternion.z, this.body.quaternion.w));
          } else {
            this.el.object3D.quaternion.copy(new THREE.Quaternion(this.body.quaternion.x, this.body.quaternion.y, this.body.quaternion.z, this.body.quaternion.w));
          }
        }
      });

      // Speed display
      AFRAME.registerComponent('speed-display', {
        init: function () {
          this.player = document.querySelector('#player');
          this.textEl = document.querySelector('#speedText');
        },
        tick: function () {
          if (!this.player || !this.player.body) return;
          const v = this.player.body.velocity;
          const speed = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
          this.textEl.setAttribute('value', 'Speed: ' + speed.toFixed(2) + ' m/s');
        }
      });

      document.querySelector('a-scene').setAttribute('speed-display', '');
    </script>
  </body>
</html>
