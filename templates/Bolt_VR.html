<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>A-Frame Physics Test</title>

  <!-- A-Frame + Physics -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>

  <script>
    // Simple kinematic locomotion
    AFRAME.registerComponent('vr-test-locomotion', {
      schema: { speed: {default: 0.3}, jump: {default: 0.5} },
      init: function () {
        this.keys = {};
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => this.keys[e.code] = false);
      },
      tick: function () {
        const pos = this.el.object3D.position;
        const cam = this.el.querySelector('[camera]');
        const rot = cam.getAttribute('rotation');
        let dir = new THREE.Vector3();

        // WASD input
        if (this.keys['KeyW']) dir.z -= 1;
        if (this.keys['KeyS']) dir.z += 1;
        if (this.keys['KeyA']) dir.x -= 1;
        if (this.keys['KeyD']) dir.x += 1;

        if (dir.lengthSq() > 0) {
          dir.normalize();
          dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(rot.y));
          pos.addScaledVector(dir, this.data.speed);
          this.el.body.needUpdate = true; // sync physics
        }

        // Jump (basic)
        if (this.keys['Space']) {
          pos.y += this.data.jump;
          this.el.body.needUpdate = true;
          this.keys['Space'] = false; // prevent holding
        }
      }
    });
  </script>
</head>

<body>
  <a-scene physics="driver: ammo; debug: true; gravity: 0 -9.8 0" background="color: #87CEEB">
    
    <!-- Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#777"
             ammo-body="type: static;" 
             ammo-shape="type: box; halfExtents: 25 0.1 25"></a-plane>
    
    <!-- Test Boxes -->
    <a-box position="0 1 -5" width="2" height="2" depth="2" color="red"
           ammo-body="type: static;"
           ammo-shape="type: box; halfExtents: 1 1 1"></a-box>

    <a-box position="3 1 -5" width="2" height="2" depth="2" color="green"
           ammo-body="type: static;"
           ammo-shape="type: box; halfExtents: 1 1 1"></a-box>

    <!-- Ramp -->
    <a-box position="-3 0.5 -8" width="6" height="1" depth="8" rotation="0 0 25" color="blue"
           ammo-body="type: static;"
           ammo-shape="type: box; halfExtents: 3 0.5 4"></a-box>

    <!-- Player -->
    <a-entity id="player"
              position="0 2 5"
              ammo-body="type: kinematic;"
              ammo-shape="type: capsule; radius: 0.4; height: 1.8"
              vr-test-locomotion>
      <a-camera position="0 0.7 0"
                look-controls="pointerLockEnabled: true"
                wasd-controls="enabled: false"></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
