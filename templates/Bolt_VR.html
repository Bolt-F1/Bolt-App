<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Scene with Physics</title>

  <!-- A-Frame -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js"></script>
  <!-- Physics system -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe-physics-system/4.0.1/aframe-physics-system.min.js"></script>
  <!-- OBJ/MTL loader -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <script>
    // Natural locomotion with acceleration
    AFRAME.registerComponent('vr-natural-locomotion', {
      schema: { speed: {default: 5}, maxSpeed: {default: 15}, acceleration: {default: 0.3} },
      init: function() {
        this.velocity = new THREE.Vector3();
        this.currentSpeed = 0;
        this.keys = {};
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => this.keys[e.code] = false);
      },
      tick: function(time, dt) {
        const delta = dt / 1000;
        let input = new THREE.Vector3();
        if (this.keys['KeyW'] || this.keys['ArrowUp']) input.z -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) input.z += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) input.x -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) input.x += 1;

        if (input.length() > 0) {
          input.normalize();
          this.currentSpeed += (this.data.maxSpeed - this.currentSpeed) * this.data.acceleration;
          input.multiplyScalar(this.currentSpeed);
          this.el.body.setLinearVelocity(new CANNON.Vec3(input.x, this.el.body.velocity.y, input.z));
        } else {
          this.currentSpeed *= 0.9;
        }
      }
    });

    // Spawn high and prevent underground
    AFRAME.registerComponent('spawn-fix', {
      schema: { height: {default: 5} },
      init: function() {
        const pos = this.el.getAttribute('position');
        pos.y = this.data.height;
        this.el.setAttribute('position', pos);
      }
    });

    // Modify OBJ materials after load
    AFRAME.registerComponent('modify-materials', {
      schema: { color: {default: 'red'} },
      init: function() {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          obj.traverse(node => {
            if (node.isMesh) node.material.color.set(this.data.color);
          });
        });
      }
    });
  </script>
</head>

<body>
  <a-scene physics="driver: ammo; gravity: -9.8;" background="color: #87CEEB">

    <!-- Assets -->
    <a-assets>
      <a-asset-item id="cityObj" src="{{ url_for('static', filename='models/Bolt_City_Proto_2.obj') }}"></a-asset-item>
      <a-asset-item id="cityMtl" src="{{ url_for('static', filename='models/Bolt_City_Proto_2.mtl') }}"></a-asset-item>
    </a-assets>

    <!-- Lights -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="10 15 5" castShadow></a-entity>

    <!-- Ground plane -->
    <a-plane rotation="-90 0 0" width="100" height="100" color="#228B22" static-body></a-plane>

    <!-- Large OBJ+MTL model -->
    <a-entity 
      obj-model="obj: #cityObj; mtl: #cityMtl" 
      static-body="shape: mesh" 
      scale="1 1 1" 
      position="0 0 0" 
      modify-materials="color: lightgray">
    </a-entity>

    <!-- Player rig -->
    <a-entity id="player-rig" position="0 5 10" vr-natural-locomotion physics-body="shape: capsule; height: 1.8; radius: 0.4; mass: 70;" spawn-fix>
      <a-camera position="0 1.6 0"></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
