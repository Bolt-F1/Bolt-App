<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VR City with Collisions & Reflections</title>

  <!-- Official A-Frame + Physics -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  
  <!-- Environment component for reflections -->
  <script src="https://cdn.jsdelivr.net/gh/etiennepinchon/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>

  <!-- Natural locomotion -->
  <script>
    AFRAME.registerComponent('vr-natural-locomotion', {
      schema: {
        maxSpeed: {default: 12},
        acceleration: {default: 0.5},
        deceleration: {default: 0.2}
      },
      init: function() {
        this.velocity = new THREE.Vector3();
        this.targetVelocity = new THREE.Vector3();
        this.currentSpeed = 0;
        this.keys = {};
        this.isMoving = false;
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => this.keys[e.code] = false);
      },
      tick: function(time, delta) {
        const dt = delta / 1000;
        let inputVector = new THREE.Vector2();

        // Desktop controls
        if (!this.el.is('vr-mode')) {
          if (this.keys['KeyW'] || this.keys['ArrowUp']) inputVector.y = 1;
          if (this.keys['KeyS'] || this.keys['ArrowDown']) inputVector.y = -1;
          if (this.keys['KeyA'] || this.keys['ArrowLeft']) inputVector.x = -1;
          if (this.keys['KeyD'] || this.keys['ArrowRight']) inputVector.x = 1;
        }

        const inputMag = inputVector.length();

        if (inputMag > 0.1) {
          this.isMoving = true;
          const targetSpeed = inputMag * this.data.maxSpeed;
          this.currentSpeed += (targetSpeed - this.currentSpeed) * this.data.acceleration;

          const headRot = this.el.querySelector('a-camera').getAttribute('rotation');
          const dir = new THREE.Vector3(inputVector.x, 0, inputVector.y).normalize();
          dir.applyAxisAngle(new THREE.Vector3(0,1,0), THREE.MathUtils.degToRad(headRot.y));
          this.targetVelocity.copy(dir.multiplyScalar(this.currentSpeed));
        } else {
          this.isMoving = false;
          this.currentSpeed *= (1 - this.data.deceleration);
          if (this.currentSpeed < 0.01) this.currentSpeed = 0;
          this.targetVelocity.set(0,0,0);
        }

        if (this.el.body) {
          const vel = this.el.body.getLinearVelocity();
          this.el.body.setLinearVelocity(
            this.targetVelocity.x,
            vel.y,
            this.targetVelocity.z
          );
        }
      }
    });
  </script>
</head>

<body>
  <a-scene physics="driver: ammo; gravity: -9.8" background="color: #87CEEB" stats>

    <a-assets>
      <a-asset-item id="cityVisual" src="{{ url_for('static', filename='models/Bolt_City_V2.gltf') }}"></a-asset-item>
      <a-asset-item id="cityCollide" src="{{ url_for('static', filename='models/Bolt_City_V2_Collidable_2.gltf') }}"></a-asset-item>
      <img id="skyTexture" src="{{ url_for('static', filename='textures/sky.hdr') }}">
    </a-assets>

    <!-- Environment for reflections -->
    <a-entity environment="preset: city; skyType: color; skyColor: #87CEEB; groundColor: #777; ground: flat; fog: 0.5"></a-entity>

    <!-- Lights -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8"
              position="10 15 5"
              shadow="cast: true; type: pcf; shadowMapWidth: 2048; shadowMapHeight: 2048"></a-entity>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="200" height="200" color="#777" static-body shadow="receive: true"></a-plane>

    <!-- Visual city -->
    <a-entity gltf-model="#cityVisual" scale="1 1 1" position="0 0 0"></a-entity>

    <!-- Collidable city (invisible) -->
    <a-entity gltf-model="#cityCollide"
              static-body="shape: mesh;"
              visible="false"
              scale="1 1 1"
              position="0 0 0"></a-entity>

    <!-- Player capsule -->
    <a-entity id="player" position="0 3 10"
              kinematic-body="shape: capsule; height: 1.8; radius: 0.4; mass: 70"
              vr-natural-locomotion>
      <a-camera position="0 1.6 0"></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
