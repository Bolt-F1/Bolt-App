<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolt Interactive AR - Full Aero</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
    model-viewer { width: 100%; height: 100vh; }

    /* Custom AR Button */
    #ar-button {
      background-color: #ffd700;
      border-radius: 8px;
      border: none;
      position: absolute;
      top: 20px; right: 20px;
      z-index: 100;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Hotspot Styling */
    .Hotspot {
      background: #ffd700;
      border-radius: 50%;
      border: 2px solid #fff;
      width: 20px;
      height: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .HotspotAnnotation {
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      border-radius: 6px;
      border: 1px solid #ffd700;
      padding: 10px;
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: max-content;
      max-width: 200px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .Hotspot.active .HotspotAnnotation { opacity: 1; }
  </style>
</head>
<body>

<model-viewer id="viewer"
              src="{{ url_for('static', filename='Bolt_AR.glb') }}"
              ar ar-modes="webxr scene-viewer quick-look"
              camera-controls shadow-intensity="1"
              exposure="1">

  <button slot="ar-button" id="ar-button">VIEW IN AR</button>

  <button class="Hotspot" slot="hotspot-front-wing" 
          data-position="0m 0.05m 1.8m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Front Wing</strong><br>Multi-element assembly for front-end downforce.</div>
  </button>

  <button class="Hotspot" slot="hotspot-rear-wing" 
          data-position="0m 0.8m -2.2m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Rear Wing</strong><br>High-lift element with integrated endplates.</div>
  </button>

  <button class="Hotspot" slot="hotspot-nose" 
          data-position="0m 0.2m 1.2m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Nosecone</strong><br>Impact structure and aerodynamic guide.</div>
  </button>

  <button class="Hotspot" slot="hotspot-sidepod" 
          data-position="0.6m 0.1m 0m" data-normal="1m 0m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Sidepods</strong><br>Airflow management for aero.</div>
  </button>

  <button class="Hotspot" slot="hotspot-rearpod" 
          data-position="0.5m 0.15m -1.5m" data-normal="1m 0m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Rearpods</strong><br>Rear bodywork for wake control.</div>
  </button>

  <button class="Hotspot" slot="hotspot-chassis" 
          data-position="0m 0.2m 0m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Chassis</strong><br>The central "Bolt" structural frame.</div>
  </button>

</model-viewer>

<script>
  function toggle(dot) {
    // Close other hotspots first
    document.querySelectorAll('.Hotspot').forEach(h => {
      if (h !== dot) h.classList.remove('active');
    });
    // Toggle the clicked one
    dot.classList.toggle('active');
  }

  // Close when clicking model background
  document.querySelector('#viewer').addEventListener('click', (event) => {
    if (event.target.tagName !== 'BUTTON') {
      document.querySelectorAll('.Hotspot').forEach(h => h.classList.remove('active'));
    }
  });
</script>

</body>
</html>
