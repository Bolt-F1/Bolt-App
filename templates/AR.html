<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interactive AR Shapes Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family: Arial; overflow: hidden; }
    model-viewer { width:100%; height: 100vh; }
 
    #infoCard {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: gold;
      padding: 12px;
      border-radius: 10px;
      display: none;
      max-width: 250px;
      text-align: center;
      z-index: 10;
    }
 
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
 
    button {
      padding: 10px;
      margin: 5px;
      background: black;
      color: gold;
      border: 1px solid gold;
      cursor: pointer;
    }
 
    /* AR button styling */
    model-viewer::part(ar-button) {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      width: 70px !important;
      height: 70px !important;
      border-radius: 50% !important;
      z-index: 9999 !important;
    }
  </style>
</head>
<body>
 
<div id="ui">
  <button onclick="explodeView()">Explode View</button>
  <button onclick="resetView()">Reset</button>
</div>
 
<div id="infoCard">Info will appear here</div>
 
<!-- Default GLB model -->
<model-viewer id="viewer"
              src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
              ar
              ar-modes="webxr scene-viewer quick-look"
              ar-button="enabled"
              camera-controls
              touch-action="pan-y"
              exposure="1">
</model-viewer>
 
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';

const viewer = document.getElementById('viewer');
const infoCard = document.getElementById('infoCard');
let highlighted = null;

// Wait for the model to load
viewer.addEventListener('load', () => {
  const model = viewer.model; // THREE.Group of the GLB

  // Map shapes by their node names (example nodes inside GLB)
  const shapes = {
    Helmet: model.getObjectByName('Helmet') || model, // fallback to whole model
    Backpack: model.getObjectByName('Backpack') || model
  };

  // Explode positions
  window.explodeView = () => {
    if(shapes.Helmet) shapes.Helmet.position.x -= 0.2;
    if(shapes.Backpack) shapes.Backpack.position.x += 0.2;
  };

  window.resetView = () => {
    if(shapes.Helmet) shapes.Helmet.position.x = 0;
    if(shapes.Backpack) shapes.Backpack.position.x = 0;
    infoCard.style.display = 'none';
    if(highlighted) {
      highlighted.material.emissive.setHex(0x000000);
      highlighted = null;
    }
  };

  // Raycasting for clicks
  viewer.canvas.addEventListener('click', (event) => {
    const rect = viewer.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    const camera = viewer.camera;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera({x, y}, camera);

    const intersects = raycaster.intersectObjects(Object.values(shapes), true);

    if (intersects.length > 0) {
      const obj = intersects[0].object;
      // Highlight
      if (highlighted) highlighted.material.emissive.setHex(0x000000);
      obj.material.emissive.setHex(0xffff00);
      highlighted = obj;

      // Show info card
      const shapeName = Object.keys(shapes).find(k => shapes[k] === obj) || obj.name || "Selected Part";
      infoCard.innerHTML = `This is the ${shapeName}`;
      infoCard.style.display = 'block';
    }
  });
});
</script>
 
</body>
</html>
