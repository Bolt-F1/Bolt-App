<!DOCTYPE html>
<html>


<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<body>
<!-- File input for uploading your 3D model -->
<input type="file" id="modelFile" accept=".glb,.gltf" style="position: absolute; top: 10px; left: 10px; z-index: 10;">

<!-- The AR model viewer -->
<model-viewer id="viewer"
              ar
              ar-modes="webxr scene-viewer quick-look"
              camera-controls
              touch-action="pan-y"
              style="width:100%; height:80vh;">
</model-viewer>

<!-- Include model-viewer library -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- JS to load user-selected model -->
<script>
const input = document.getElementById('modelFile');
const viewer = document.getElementById('viewer');

input.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // Only allow glb/gltf
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext !== 'glb' && ext !== 'gltf') {
    alert('Please upload a .glb or .gltf model!');
    return;
  }

  const url = URL.createObjectURL(file);
  viewer.src = url;
});


</script>

<style>
  model-viewer {
      width: 100%;
      height: 80vh;
  }
  
  /* Make AR button sit ABOVE everything and receive clicks */
  model-viewer::part(ar-button) {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 9999 !important;
      width: 70px !important;
      height: 70px !important;
      border-radius: 50% !important;
      pointer-events: auto !important;
  }
  </style>


</body>
</html>
