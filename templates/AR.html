<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive AR Astronaut</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; }
    model-viewer { width: 100%; height: 100vh; --poster-color: transparent; }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffd700;
      border: 1px solid #ffd700;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background: #ffd700;
      color: black;
    }

    #infoCard {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #ffd700;
      display: none; /* Hidden by default */
      text-align: center;
      min-width: 200px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .highlight-text {
      color: #ffd700;
      display: block;
      font-size: 1.2em;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="resetView()">Reset Selection</button>
</div>

<div id="infoCard">
  Selecting part...
  <span id="partName" class="highlight-text"></span>
</div>

<model-viewer id="viewer"
              src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
              ar
              ar-modes="webxr scene-viewer quick-look"
              camera-controls
              touch-action="pan-y"
              shadow-intensity="1"
              exposure="1">
</model-viewer>

<script>
  const viewer = document.querySelector('#viewer');
  const infoCard = document.querySelector('#infoCard');
  const partNameDisplay = document.querySelector('#partName');
  
  let lastMaterial = null;

  // Listen for clicks/taps on the model
  viewer.addEventListener('click', (event) => {
    // Check if the click hit the model and which material it hit
    const material = viewer.materialFromPoint(event.clientX, event.clientY);

    if (material) {
      displayInfo(material);
    } else {
      hideInfo();
    }
  });

  function displayInfo(material) {
    // Reset previous material color if it exists
    if (lastMaterial) {
      lastMaterial.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
    }

    // Set the display text (using the material name from the GLB)
    partNameDisplay.textContent = material.name || "Unknown Component";
    infoCard.style.display = 'block';

    // Visual feedback: Highlight the part by tinting it gold
    material.pbrMetallicRoughness.setBaseColorFactor([1, 0.84, 0, 1]);
    lastMaterial = material;
  }

  function hideInfo() {
    infoCard.style.display = 'none';
    if (lastMaterial) {
      lastMaterial.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
      lastMaterial = null;
    }
  }

  window.resetView = () => {
    hideInfo();
  };
</script>

</body>
</html>
