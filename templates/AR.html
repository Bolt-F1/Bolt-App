<!DOCTYPE html>
<html>
<head>
  <title>WebXR AR Shapes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin: 0; overflow: hidden; }
    #infoBox {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 12px 18px;
      border-radius: 10px;
      display: none;
      font-family: Arial;
    }
  </style>
</head>

<body>

<div id="infoBox"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/ARButton.js';

let camera, scene, renderer;
let controller;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;

let objects = [];
let selected = null;

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);
  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

  // Light
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Reticle (shows where floor is)
  const geometry = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI / 2);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  reticle = new THREE.Mesh(geometry, material);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  renderer.setAnimationLoop(render);
}

function onSelect() {
  if (reticle.visible) {
    // Create random shape
    const shapeType = Math.floor(Math.random() * 3);
    let mesh;

    if (shapeType === 0) {
      mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.2,0.2),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      mesh.userData.info = "Cube";
    }
    else if (shapeType === 1) {
      mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.15,32,32),
        new THREE.MeshStandardMaterial({ color: 0x0000ff })
      );
      mesh.userData.info = "Sphere";
    }
    else {
      mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1,0.1,0.3,32),
        new THREE.MeshStandardMaterial({ color: 0x00ff00 })
      );
      mesh.userData.info = "Cylinder";
    }

    mesh.position.setFromMatrixPosition(reticle.matrix);
    mesh.userData.originalColor = mesh.material.color.getHex();

    scene.add(mesh);
    objects.push(mesh);
  }
}

// Tap detection (for selecting objects)
window.addEventListener("click", (event) => {
  const mouse = new THREE.Vector2(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1
  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(objects);

  if (intersects.length > 0) {
    const obj = intersects[0].object;

    if (selected) {
      selected.material.color.setHex(selected.userData.originalColor);
    }

    obj.material.color.setHex(0xffff00);
    selected = obj;

    const infoBox = document.getElementById("infoBox");
    infoBox.innerText = obj.userData.info;
    infoBox.style.display = "block";
  }
});

function render(timestamp, frame) {

  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((space) => {
        session.requestHitTestSource({ space: space }).then((source) => {
          hitTestSource = source;
        });
      });

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
