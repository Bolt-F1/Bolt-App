<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Model AR</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/webxr/ARButton.js"></script>

<style>
body { margin: 0; overflow: hidden; }
#upload {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
}
</style>
</head>

<body>

<input type="file" id="upload" multiple accept=".glb,.gltf">

<script>
let scene, camera, renderer, controller;
let models = [];
let modelIndex = 0;
let reticle;

init();

function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test']
    }));

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // RETICLE (ground placement indicator)
    const geometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI/2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(geometry, material);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    controller = renderer.xr.getController(0);
    scene.add(controller);

    // Tap to place model
    controller.addEventListener('select', () => {
        if (models.length === 0) return;
        if (!reticle.visible) return;

        const model = models[modelIndex].clone();

        model.position.setFromMatrixPosition(reticle.matrix);
        scene.add(model);

        // Cycle models
        modelIndex = (modelIndex + 1) % models.length;
    });

    // Load models
    const loader = new THREE.GLTFLoader();
    document.getElementById("upload").addEventListener("change", (e) => {
        for (const file of e.target.files) {
            const url = URL.createObjectURL(file);

            loader.load(url, (gltf) => {
                models.push(gltf.scene);
                console.log("Loaded:", file.name);
            });
        }
    });

    // HIT TEST SETUP
    let hitTestSource = null;
    let localSpace = null;

    renderer.xr.addEventListener("sessionstart", async () => {
        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = await session.requestReferenceSpace("local");
    });

    renderer.setAnimationLoop((timestamp, frame) => {
        if (frame) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(localSpace);

                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
            } else {
                reticle.visible = false;
            }
        }

        renderer.render(scene, camera);
    });
}
</script>

</body>
</html>
