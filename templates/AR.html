<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interactive AR Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }
    #infoCard {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: gold;
      padding: 12px;
      border-radius: 10px;
      display: none;
      max-width: 250px;
      z-index: 10;
      text-align: center;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    button {
      padding: 10px;
      margin: 5px;
      background: black;
      color: gold;
      border: 1px solid gold;
      cursor: pointer;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="explodeView()">Explode View</button>
  <button onclick="resetView()">Reset</button>
</div>

<div id="infoCard">Info will appear here</div>

<!-- Model viewer with pre-split shapes -->
<model-viewer id="viewer"
              src="{{ url_for('static', filename='models/interactive_shapes.glb') }}"
              ar
              ar-modes="webxr scene-viewer quick-look"
              camera-controls
              interaction-prompt="auto"
              touch-action="pan-y"
              exposure="1">
</model-viewer>

<script>
const viewer = document.getElementById('viewer');
const infoCard = document.getElementById('infoCard');

// Pre-defined shapes with node names from GLB
const shapes = {
  "Cube": "CubeNode",
  "Sphere": "SphereNode",
  "Cylinder": "CylinderNode"
};

// Store highlight state
let highlightedShape = null;

// Raycasting for interaction
viewer.addEventListener('click', (event) => {
  // Get canvas size
  const rect = viewer.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width * 2 - 1;
  const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  const threeRenderer = viewer.renderer;
  const scene = viewer.scene;
  const camera = viewer.camera;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera({x, y}, camera);
  
  const intersects = raycaster.intersectObjects(scene.children, true);
  
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    // Check if clicked object matches one of our node names
    const shapeName = Object.keys(shapes).find(k => obj.name.includes(shapes[k]));
    if (shapeName) {
      // Highlight
      if (highlightedShape) {
        highlightedShape.material.emissive.setHex(0x000000); // remove previous highlight
      }
      obj.material.emissive.setHex(0xffff00); // yellow highlight
      highlightedShape = obj;

      // Show info card
      infoCard.innerHTML = `This is the ${shapeName}`;
      infoCard.style.display = 'block';
    }
  }
});

// Explode / Reset positions
function explodeView() {
  viewer.model.getObjectByName("CubeNode").position.set(-0.3, 0, 0);
  viewer.model.getObjectByName("SphereNode").position.set(0, 0, 0.3);
  viewer.model.getObjectByName("CylinderNode").position.set(0.3, 0, -0.3);
}

function resetView() {
  viewer.model.getObjectByName("CubeNode").position.set(-0.1, 0, 0);
  viewer.model.getObjectByName("SphereNode").position.set(0, 0, 0);
  viewer.model.getObjectByName("CylinderNode").position.set(0.1, 0, 0);
  infoCard.style.display = 'none';
}
</script>

</body>
</html>
