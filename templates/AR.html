<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolt AR - Engineering Data</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        model-viewer { width: 100%; height: 100vh; }

        /* AR Button */
        #ar-button {
            background-color: #ffd700; border: none; border-radius: 8px;
            position: absolute; top: 20px; right: 20px; z-index: 100;
            padding: 12px 24px; font-weight: bold; cursor: pointer;
        }

        /* The Hotspot Dot */
        .Hotspot {
            background: #ffd700; border-radius: 50%; border: 2px solid #fff;
            width: 20px; height: 20px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        /* The Subtitle Card */
        .HotspotAnnotation {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            border-left: 4px solid #ffd700;
            border-radius: 4px;
            padding: 12px;
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            font-size: 13px;
            line-height: 1.4;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .Hotspot.active .HotspotAnnotation {
            opacity: 1;
            transform: translateY(-50%) translateX(10px);
        }

        /* Coordinate Finder Panel */
        #finder-panel {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(20, 20, 20, 0.9); padding: 15px; border-radius: 10px;
            border: 1px solid #444; font-family: monospace; font-size: 12px;
            z-index: 1000; width: 280px;
        }
        #copy-btn {
            margin-top: 10px; width: 100%; padding: 8px;
            background: #ffd700; border: none; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="finder-panel">
        <div style="color: #888; margin-bottom: 5px;">COORDINATE FINDER</div>
        <div id="pos-display">Click part to start...</div>
        <button id="copy-btn">COPY CODE CLIP</button>
    </div>

    <model-viewer id="viewer"
                  src="{{ url_for('static', filename='models/Bolt_AR.glb') }}"
                  ar ar-modes="webxr scene-viewer quick-look"
                  camera-controls 
                  rotation="-90deg 0 0" 
                  shadow-intensity="1">

        <button slot="ar-button" id="ar-button">VIEW IN AR</button>

        <button class="Hotspot" slot="hotspot-front" data-position="1.829m -0.173m -0.282" onclick="toggle(this)">
            <div class="HotspotAnnotation">
                <b style="color: #ffd700; font-size: 15px;">FRONT WING</b><br>
                Designed to minimise Airflow collision with the wheels, while producing the least drag possible
            </div>
        </button>

        <button class="Hotspot" slot="hotspot-rear" data-position="0.181m 0.138m 0.255m" onclick="toggle(this)">
            <div class="HotspotAnnotation">
                <b style="color: #ffd700; font-size: 15px;">REAR WING</b><br>
                Purely for the purpose of aesthetics, and with the bonus of producing rear body lift.
            </div>
        </button>

        <button class="Hotspot" slot="hotspot-side" data-position="0.951m -0.070m -0.285m" onclick="toggle(this)">
            <div class="HotspotAnnotation">
                <b style="color: #ffd700; font-size: 15px;">SIDEPODS</b><br>
                Allowing for a smooth transition between airflow from the front wheel and halo over the rear wheel.
            </div>
        </button>

        <button class="Hotspot" slot="hotspot-rearpod" data-position="0.112m -0.110m -0.259m" onclick="toggle(this)">
            <div class="HotspotAnnotation">
                <b style="color: #ffd700; font-size: 15px;">REARPODS</b><br>
                Designed to prevent and fill the formation of rear wheel wake.
            </div>
        </button>

        <button class="Hotspot" slot="hotspot-nose" data-position="1.676m -0.079m -0.004m" onclick="toggle(this)">
            <div class="HotspotAnnotation">
                <b style="color: #ffd700; font-size: 15px;">NOSECONE</b><br>
                The car's first contact with the airflow, a slicing edge to produce lift with the least drag.
            </div>
        </button>

    </model-viewer>

    <script>
        function toggle(dot) {
            const isActive = dot.classList.contains('active');
            document.querySelectorAll('.Hotspot').forEach(h => h.classList.remove('active'));
            if (!isActive) dot.classList.add('active');
        }

        const viewer = document.querySelector('#viewer');
        const display = document.querySelector('#pos-display');
        const copyBtn = document.querySelector('#copy-btn');
        let lastCode = "";

        viewer.addEventListener('click', (event) => {
            const rect = viewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const position = viewer.positionAndNormalFromPoint(x, y);
            
            if (position) {
                const {position: pos} = position;
                lastCode = `data-position="${pos.x.toFixed(3)}m ${pos.y.toFixed(3)}m ${pos.z.toFixed(3)}m"`;
                display.innerHTML = `<span style="color:#ffd700">${lastCode}</span>`;
            }
        });

        copyBtn.addEventListener('click', () => {
            if (lastCode) {
                navigator.clipboard.writeText(lastCode);
                const oldText = copyBtn.innerText;
                copyBtn.innerText = "COPIED!";
                setTimeout(() => copyBtn.innerText = oldText, 1500);
            }
        });
    </script>
</body>
</html>
