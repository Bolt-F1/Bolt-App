<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolt AR - Interactive Aero</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background-color: #000; font-family: 'Segoe UI', sans-serif; }
    model-viewer { width: 100%; height: 100vh; }

    #ar-button {
      background-color: #ffd700;
      border-radius: 8px;
      border: none;
      position: absolute;
      top: 20px; right: 20px;
      z-index: 100;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .Hotspot {
      background: #ffd700;
      border-radius: 50%;
      border: 2px solid #fff;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .HotspotAnnotation {
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      border-radius: 6px;
      border: 1px solid #ffd700;
      padding: 10px;
      position: absolute;
      left: 25px;
      top: 50%;
      transform: translateY(-50%);
      width: max-content;
      max-width: 200px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .Hotspot.active .HotspotAnnotation { opacity: 1; }

    /* Helper text for the Coordinate Finder */
    #coord-helper {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #ffd700;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="coord-helper">Dev Tip: Click the car & check Browser Console (F12) for exact coordinates</div>

<model-viewer id="viewer"
              src="{{ url_for('static', filename='models/Bolt_AR.glb') }}"
              ar ar-modes="webxr scene-viewer quick-look"
              camera-controls 
              shadow-intensity="1"
              orientation="-90deg 0 0" 
              exposure="1">

  <button slot="ar-button" id="ar-button">🚀 VIEW IN AR</button>

  <button class="Hotspot" slot="hotspot-front" data-position="0m 0m 1.5m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Front Wing</strong></div>
  </button>

  <button class="Hotspot" slot="hotspot-rear" data-position="0m 0.5m -2m" data-normal="0m 1m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Rear Wing</strong></div>
  </button>

  <button class="Hotspot" slot="hotspot-side" data-position="0.5m 0m 0m" data-normal="1m 0m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Sidepods</strong></div>
  </button>

  <button class="Hotspot" slot="hotspot-rearpod" data-position="0.5m 0m -1.2m" data-normal="1m 0m 0m" onclick="toggle(this)">
    <div class="HotspotAnnotation"><strong>Rearpods</strong></div>
  </button>

</model-viewer>

<script>
  // 1. Logic for clicking hotspots
  function toggle(dot) {
    document.querySelectorAll('.Hotspot').forEach(h => {
      if (h !== dot) h.classList.remove('active');
    });
    dot.classList.toggle('active');
  }

  // 2. COORDINATE FINDER TOOL
  // This helps you fix the "wrong coordinates" issue instantly.
  const viewer = document.querySelector('#viewer');
  viewer.addEventListener('click', (event) => {
    const rect = viewer.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    
    // This function asks the 3D model exactly where you clicked
    const position = viewer.positionAndNormalFromPoint(x, y);
    
    if (position) {
      const {position: pos, normal: norm} = position;
      console.log("--- COORD FOUND ---");
      console.log(`data-position="${pos.x.toFixed(3)}m ${pos.y.toFixed(3)}m ${pos.z.toFixed(3)}m"`);
      console.log(`data-normal="${norm.x.toFixed(2)}m ${norm.y.toFixed(2)}m ${norm.z.toFixed(2)}m"`);
      console.log("-------------------");
    }
  });
</script>

</body>
</html>
