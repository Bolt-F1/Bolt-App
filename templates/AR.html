<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi-Model AR Scene</title>
  <style>
    body { margin:0; font-family: Arial; overflow: hidden; }
    #infoCard {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: gold;
      padding: 12px;
      border-radius: 10px;
      display: none;
      max-width: 250px;
      text-align: center;
      z-index: 10;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    button {
      padding: 10px;
      margin: 5px;
      background: black;
      color: gold;
      border: 1px solid gold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="placeModel('Astronaut')">Astronaut</button>
  <button onclick="placeModel('Robot')">Robot</button>
  <button onclick="placeModel('Duck')">Duck</button>
</div>

<div id="infoCard">Info will appear here</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const models = []; // all placed GLBs
let highlighted = null;
const infoCard = document.getElementById('infoCard');

const MODEL_URLS = {
  Astronaut: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
  Robot: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb',
  Duck: 'https://modelviewer.dev/shared-assets/models/Duck.glb'
};

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Floor placeholder
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.ShadowMaterial({ opacity:0.2 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y = 0;
  scene.add(floor);

  controller = renderer.xr.getController(0);
  scene.add(controller);

  // Click/tap to select models
  window.addEventListener('click', onClick, false);
}

// Place a model in front of the camera
function placeModel(name) {
  const url = MODEL_URLS[name];
  const loader = new GLTFLoader();
  loader.load(url, (gltf) => {
    const model = gltf.scene;
    model.position.set(0, 0, -0.5); // in front of camera
    model.scale.set(0.3,0.3,0.3);
    model.userData.name = name;
    scene.add(model);
    models.push(model);
  });
}

// Select models
function onClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left)/rect.width)*2 - 1;
  mouse.y = -((event.clientY - rect.top)/rect.height)*2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(models, true);

  if(intersects.length > 0){
    const obj = intersects[0].object;
    if(highlighted) highlighted.traverse(c => { if(c.material) c.material.emissive.setHex(0x000000); });
    obj.traverse(c => { if(c.material) c.material.emissive.setHex(0xffff00); });
    highlighted = obj;

    infoCard.innerText = `This is a ${obj.userData.name || 'model'}`;
    infoCard.style.display = 'block';
  }
}

function animate() {
  renderer.setAnimationLoop(render);
}

function render() {
  renderer.render(scene, camera);
}
</script>

</body>
</html>
