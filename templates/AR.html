<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AR Shapes Demo</title>

  <!-- A-Frame + MindAR + Draggable -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }

    #infoCard {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.8);
      color: gold;
      padding: 15px;
      border-radius: 10px;
      display: none;
      max-width: 250px;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    button {
      padding: 10px;
      margin: 5px;
      background: black;
      color: gold;
      border: 1px solid gold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="ui">
  <button onclick="explodeView()">Explode View</button>
  <button onclick="resetView()">Reset</button>
</div>

<div id="infoCard"></div>

<a-scene
  mindar-image="imageTargetSrc: {{ url_for('static', filename='markers/targets.mind') }};"
  embedded
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>

  <a-box position="0 0.1 0" color="yellow" opacity="0.5"></a-box>

  <!-- Marker Target -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- TRACK / plane -->
    <a-plane rotation="-90 0 0" width="3" height="3" color="#222"></a-plane>

    <!-- Demo Shapes -->
    <a-box position="-1 0.2 0" color="red" depth="0.4" height="0.4" width="0.4" draggable click-handler data-info="This is a red cube"></a-box>
    <a-sphere position="0 0.2 0" color="blue" radius="0.2" draggable click-handler data-info="This is a blue sphere"></a-sphere>
    <a-cylinder position="1 0.2 0" color="green" radius="0.2" height="0.5" draggable click-handler data-info="This is a green cylinder"></a-cylinder>

  </a-entity>

  <a-camera position="0 0 0">
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-camera>
</a-scene>

<script>
// CLICK HANDLER
AFRAME.registerComponent('click-handler', {
  init: function () {
    this.el.addEventListener('click', () => {
      const info = this.el.getAttribute('data-info') || 'Shape';
      const card = document.getElementById('infoCard');
      card.innerHTML = info;
      card.style.display = 'block';
    });
  }
});

// EXPLODE VIEW
function explodeView() {
  const positions = ['-1 0.5 -0.5', '0 0.5 -0.5', '1 0.5 -0.5'];
  document.querySelectorAll('a-box, a-sphere, a-cylinder').forEach((el, i) => {
    el.setAttribute('animation', {
      property: 'position',
      to: positions[i],
      dur: 800
    });
  });
}

// RESET VIEW
function resetView() {
  const positions = ['-1 0.2 0', '0 0.2 0', '1 0.2 0'];
  document.querySelectorAll('a-box, a-sphere, a-cylinder').forEach((el, i) => {
    el.setAttribute('animation', {
      property: 'position',
      to: positions[i],
      dur: 800
    });
  });
  document.getElementById('infoCard').style.display = 'none';
}
</script>

</body>
</html>
