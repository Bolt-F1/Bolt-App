<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Marker-Based AR Demo</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }
    #infoCard {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.8);
      color: gold;
      padding: 12px;
      border-radius: 10px;
      display: none;
      max-width: 250px;
      z-index: 10;
    }
    button {
      padding: 10px;
      margin: 5px;
      background: black;
      color: gold;
      border: 1px solid gold;
      cursor: pointer;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="explodeView()">Explode View</button>
  <button onclick="resetView()">Reset</button>
</div>

<div id="infoCard">Info will appear here</div>

<a-scene mindar-image="imageTargetSrc: {{ url_for('static', filename='markers/targets.mind') }}; autoStart: true;" embedded color-space="sRGB" vr-mode-ui="enabled: false">
  
  <!-- Marker target -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Demo shapes -->
    <a-box id="partCube" position="-0.5 0.2 0" color="red" draggable click-handler data-info="This is a red cube"></a-box>
    <a-sphere id="partSphere" position="0 0.2 0" color="blue" radius="0.2" draggable click-handler data-info="This is a blue sphere"></a-sphere>
    <a-cylinder id="partCylinder" position="0.5 0.25 0" color="green" radius="0.15" height="0.5" draggable click-handler data-info="This is a green cylinder"></a-cylinder>

    <!-- Debug cube -->
    <a-box id="debugBox" position="0 0.3 0" color="yellow" opacity="0.5" visible="false"></a-box>

  </a-entity>

  <a-camera position="0 0 0"></a-camera>
</a-scene>

<script>
// CLICK HANDLER
AFRAME.registerComponent('click-handler', {
  init: function () {
    this.el.addEventListener('click', () => {
      const info = this.el.getAttribute('data-info') || 'Shape';
      const card = document.getElementById('infoCard');
      card.innerHTML = info;
      card.style.display = 'block';
    });
  }
});

// EXPLODE / RESET
function explodeView() {
  document.getElementById('partCube').setAttribute('animation', { property: 'position', to: '-1 0.5 0', dur: 800 });
  document.getElementById('partSphere').setAttribute('animation', { property: 'position', to: '0 0.5 0.5', dur: 800 });
  document.getElementById('partCylinder').setAttribute('animation', { property: 'position', to: '1 0.5 0', dur: 800 });
}

function resetView() {
  document.getElementById('partCube').setAttribute('animation', { property: 'position', to: '-0.5 0.2 0', dur: 800 });
  document.getElementById('partSphere').setAttribute('animation', { property: 'position', to: '0 0.2 0', dur: 800 });
  document.getElementById('partCylinder').setAttribute('animation', { property: 'position', to: '0.5 0.25 0', dur: 800 });
  document.getElementById('infoCard').style.display = 'none';
}

// DEBUGGING: show cube when marker detected
const target = document.querySelector('[mindar-image-target]');
const debugBox = document.getElementById('debugBox');

target.addEventListener('targetFound', () => {
  console.log('Marker detected!');
  debugBox.setAttribute('visible', true);
  document.getElementById('infoCard').innerHTML = 'Marker detected!';
  document.getElementById('infoCard').style.display = 'block';
});

target.addEventListener('targetLost', () => {
  console.log('Marker lost!');
  debugBox.setAttribute('visible', false);
  document.getElementById('infoCard').style.display = 'none';
});
</script>

</body>
</html>
