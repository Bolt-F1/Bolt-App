<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>

    <div class="home">
        <ul>
            <li><a href="{{ url_for('chat') }}"><img src="{{ url_for('static', filename='images/Home_icon.png') }}" width="100" height="100" alt="Home"></a></li>
        </ul>
    </div>
    
    <title>Bolt Lumin</title>
    <img src="{{ url_for('static', filename='images/ai_icon.png') }}" alt="lumin" width="200" height="200" >
    <h1>Chat with Lumin</h1>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="chatbot_body">
        <div class="chatbot_output" id="chatbot_output">
            {% for i in chatbot_convo %}
            <p class="chatbot_query"><b>Q:</b> {{ i['query'] }}</p>
            <p class="chatbot_answer"><b>A:</b> {{ i['answer'] }}</p>
            {% endfor %}
        </div>

        <div class="chatbot_input_box">
            <form id="chatbot_form" class="chatbot_input_form">
                <input type="text" name="chatbot_query" placeholder="Ask any question..." required>
                <button type="submit" id="sendBtn" style="background-color: black; color: wheat; outline: wheat;">Send</button>
            </form>
            <p id="loading_msg" style="display:none; color: orange;">Chatbot is processing, please wait...</p>
        </div>
    </div>

    

    <!-- AJAX with loading lock -->
    <script>
    const form = document.getElementById("chatbot_form");
    const sendBtn = document.getElementById("sendBtn");
    const loadingMsg = document.getElementById("loading_msg");
    let isProcessing = false;  // lock

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (isProcessing) {
            alert("Chatbot is busy. Please wait for the current answer.");
            return;
        }

        isProcessing = true;
        sendBtn.disabled = true;
        loadingMsg.style.display = "block";

        const query = form.chatbot_query.value;

        try {
            const response = await fetch("/chatbot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chatbot_query: query })
            });

            if (!response.ok) {
                alert("Server is busy. Try again later.");
                return;
            }

            const data = await response.json();

            // Append new question and answer
            const outputDiv = document.getElementById("chatbot_output");
            const qElem = document.createElement("p");
            qElem.className = "chatbot_query";
            qElem.innerHTML = `<b>Q:</b> ${query}`;
            const aElem = document.createElement("p");
            aElem.className = "chatbot_answer";
            aElem.innerHTML = `<b>A:</b> ${data.answer}`;

            outputDiv.appendChild(qElem);
            outputDiv.appendChild(aElem);

        } catch (err) {
            alert("Error communicating with server.");
            console.error(err);
        } finally {
            // Unlock
            isProcessing = false;
            sendBtn.disabled = false;
            loadingMsg.style.display = "none";
            form.chatbot_query.value = "";
            form.chatbot_query.focus();
        }
    });
    </script>
</body>
</html>
