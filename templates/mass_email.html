<!DOCTYPE html>
<html>
<head>
  <title>Mass Email Sender</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <h2>Mass Email Sender</h2>

  <form method="POST" enctype="multipart/form-data" class="login">
    
    <label>Subject:</label>
    <input type="text" name="subject" required>

    <label>Contacts (Name,email per line):</label>
    <textarea name="contacts" rows="8" required></textarea>

    <label>Attach Prospectus:</label>
    <input type="file" name="attachment" accept=".pdf">

    <button type="submit">Send Emails</button>
  </form>

</body>
</html>
