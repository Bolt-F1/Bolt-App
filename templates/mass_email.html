<!DOCTYPE html>
<html>
<head>
  <title>Mass Email Sender</title>
</head>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<body style="font-family: Arial; padding: 40px;">

  <h2>Mass Email Sender</h2>

  <form method="POST" enctype="multipart/form-data">
    <label>Subject:</label><br>
    <input type="text" name="subject" required style="width: 300px;"><br><br>

    <label>Contacts (Name,email per line):</label><br>
    <textarea name="contacts" rows="8" cols="50" required></textarea><br><br>

    <label>Attach Prospectus:</label><br>
    <input type="file" name="attachment" accept=".pdf"><br><br>

    <button type="submit">Send Emails</button>
  </form>

</body>
</html>
