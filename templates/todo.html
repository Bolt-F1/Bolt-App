<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bolt To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header class="header">
        <h1>The Bolt To-Do List</h1>
    </header>

    <div id="timeline-container"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
fetch("/timeline/data")
.then(res => res.json())
.then(data => {
    const events = data.events;
    const progressDate = new Date(data.progress_date);

    const container = d3.select("#timeline-container");
    const width = 1000;
    const height = 120;
    
    const svg = container.append("svg")
        .attr("width", width)
        .attr("height", height);

    const parseDate = d3.timeParse("%Y-%m-%d");
    const dates = events.map(d => parseDate(d.due_date));

    const x = d3.scaleTime()
        .domain([d3.min(dates), d3.max(dates)])
        .range([50, width-50]);

    // Timeline line
    svg.append("line")
        .attr("x1", x(d3.min(dates)))
        .attr("x2", x(d3.max(dates)))
        .attr("y1", height/2)
        .attr("y2", height/2)
        .attr("stroke", "#FFD700")
        .attr("stroke-width", 4);

    // Events as circles
    svg.selectAll("circle")
        .data(events)
        .enter()
        .append("circle")
        .attr("cx", d => x(parseDate(d.due_date)))
        .attr("cy", height/2)
        .attr("r", 12)
        .attr("fill", "#FFD700")
        .attr("stroke", "#111")
        .attr("stroke-width", 2)
        .on("mouseover", (event,d) => {
            d3.select("#tooltip")
              .style("left", event.pageX + "px")
              .style("top", event.pageY - 30 + "px")
              .style("display", "block")
              .html(`<strong>${d.title}</strong><br>${d.description || ""}`);
        })
        .on("mouseout", () => d3.select("#tooltip").style("display", "none"));

    // Progress line
    let progress = svg.append("line")
        .attr("x1", x(progressDate))
        .attr("x2", x(progressDate))
        .attr("y1", height/2 - 20)
        .attr("y2", height/2 + 20)
        .attr("stroke", "red")
        .attr("stroke-width", 4)
        .call(d3.drag()
            .on("drag", (event) => {
                let newX = Math.max(50, Math.min(width-50, event.x));
                progress.attr("x1", newX).attr("x2", newX);
            })
            .on("end", (event) => {
                let newDate = x.invert(event.x);
                fetch("/timeline/update_progress", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({progress_date: d3.timeFormat("%Y-%m-%d")(newDate)})
                });
            })
        );

});
</script>

<div id="tooltip" style="position:absolute; display:none; background:#111; color:#FFD700; padding:5px; border-radius:5px; pointer-events:none;"></div>


    <main class="main-container">

        <!-- Create Task Panel -->
        <section class="create-task-panel">
            <h2>Add a Task</h2>
            <form method="POST" class="create-task-form">
                <input type="hidden" name="form_id" value="create_task">
                <input type="text" name="todo-title" placeholder="Task Title" required>
                <input type="text" name="todo-body" placeholder="Details" required>
                <input type="text" name="todo-deadline" placeholder="Deadline (YYYY-MM-DD)" required>
                <button type="submit" class="btn-submit">Add Task</button>
            </form>
        </section>

        <!-- Toggle Completed Tasks -->
        <section class="toggle-completed">
            <form method="GET">
                <input type="hidden" name="username" value="{{ username }}">
                {% if show_completed %}
                    <input type="hidden" name="show_completed" value="0">
                    <button type="submit" class="btn-toggle">Hide Completed</button>
                {% else %}
                    <input type="hidden" name="show_completed" value="1">
                    <button type="submit" class="btn-toggle">Show Completed</button>
                {% endif %}
            </form>
        </section>

        <!-- Task List -->
        <section class="task-list">
            {% for i in todolist_items %}
            <div class="task-card {% if i.completed_at %}completed{% endif %}">
                <div class="task-header">
                    <span class="task-title">{{ i.title }}</span>
                    {% if i.completed_at %}
                        <span class="task-status">Completed</span>
                    {% endif %}
                </div>
                <p class="task-body">{{ i.body }}</p>
                <div class="task-meta">
                    <span>Set by: {{ i.creater }}</span>
                    <span>Deadline: {{ i.deadline }}</span>
                </div>
                {% if not i.completed_at %}
                <form method="POST" class="complete-task-form">
                    <input type="hidden" name="task_id" value="{{ i.id }}">
                    <input type="hidden" name="form_id" value="complete_task">
                    <button type="submit" class="btn-complete">Mark as Completed</button>
                </form>
                {% endif %}
            </div>
            {% endfor %}
        </section>
        

    </main>

    <nav class="bottom-menu">
        <ul>
            <li><a href="{{ url_for('chat') }}"><img src="{{ url_for('static', filename='images/Message_Icon.png') }}" width="100" height="100" alt="Chat"></a></li>
            <li><a href="{{ url_for('todo') }}"><img src="{{ url_for('static', filename='images/to_do_list_icon.png') }}" alt="Tasks"></a></li>
            <li><a href="{{ url_for('chatbot') }}"><img src="{{ url_for('static', filename='images/Bolt_AI_Icon.png') }}" alt="Chatbot"></a></li>
            <li><a href="{{ url_for('sim') }}"><img src="{{ url_for('static', filename='images/Sim_icon.png') }}" alt="Sim"></a></li>
            <li><a href="{{ url_for('react') }}"><img src="{{ url_for('static', filename='images/Reaction_Time_Icon.png') }}" alt="Reaction Time"></a></li>
            <li><a href="{{ url_for('AR_sim') }}"><img src="{{ url_for('static', filename='images/AR_icon.png') }}" alt="AR Sim"></a></li>
            <li><a href="{{ url_for('finance') }}"><img src="{{ url_for('static', filename='images/finance_icon.png') }}" alt="Finance"></a></li>
    </nav>

</body>
</html>
